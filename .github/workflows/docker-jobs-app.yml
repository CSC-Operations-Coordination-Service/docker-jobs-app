name: docker-jobs-app CI/CD

# The Grafana app plugin, delivered as an nginx image serving the plugin zip
# (Dockerfile; deployed by docker-jobs-backend's deploy/). Like maas-dm-app.yml:
#   node-workflow.yml — npm ci -> lint -> build -> test
#   (package)         — the plugin zip as a workflow artifact
#   docker-build.yml  — the delivery image; its Dockerfile builds and packages
#                       the plugin itself, so no artifact is handed over
#
# docker-build.yml is called directly rather than through node-workflow's
# build-image: that path does not forward insecure-registry, which the plain-HTTP
# Nexus Docker connector needs.
#
# Version: the release tag (x.y.z) on tags, package.json's version otherwise.
# Signing: only when GRAFANA_ACCESS_POLICY_TOKEN and the SIGN_ROOT_URLS variable
# exist; unsigned otherwise (Grafana must allow it).

on:
  push:
    branches:
      - "develop"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    permissions:
      contents: read
      # node-workflow.yml declares its optional image-build job with
      # packages: write. GitHub checks nested permissions before the run
      # starts, even for a job that is then skipped, so the caller must grant it.
      packages: write
    uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/workflows/node-workflow.yml@ci/npm-registry
    with:
      working-directory: .
      node-version: "22.23.3"
      use-nexus-registry: true
      # TEMPORARY (2026-10-14): CI skips the optional @swc/core-linux-x64-gnu
      # ("Failed to load native binding" at build). Install verbosely and
      # publish npm's lines about it as warning annotations, which the API
      # serves without a login. Revert to the default once found.
      install-command: |
        npm ci --loglevel=verbose > npm-ci.log 2>&1 || { tail -40 npm-ci.log; exit 1; }
        grep -i -E 'core-linux-x64|reify failed optional|EBADPLATFORM|ENOSPC|EINTEGRITY|E401|E403|E404|ETIMEDOUT|ECONNRESET|EAI_AGAIN' npm-ci.log | head -25 | sed 's/^/::warning title=npm ci::/' || true
        node -p "'libc: ' + JSON.stringify(process.report.getReport().header.glibcVersionRuntime) + ', arch: ' + process.arch + ', npm: ' + require('child_process').execSync('npm --version').toString().trim()" | sed 's/^/::warning title=platform::/'
        ls node_modules/@swc | sed 's/^/::warning title=installed @swc::/'
      run-tests: true
      test-command: npm run test:ci
    secrets: inherit

  package:
    needs: node
    runs-on: self-hosted
    container:
      image: node:22.23.3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Nexus npm registry
        uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/actions/npm-context@develop
        with:
          registry-repo: npm-proxy
          nexus-host: ${{ secrets.NEXUS_HOST }}
          nexus-port: ${{ secrets.NEXUS_PORT }}
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Install zip
        run: apt-get update && apt-get install -y --no-install-recommends zip

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Package
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          SIGN_ROOT_URLS: ${{ vars.SIGN_ROOT_URLS }}
        run: ./scripts/package.sh

      - name: Upload the plugin zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocs-dockerjobs-app-zip
          path: |
            ocs-dockerjobs-app-*.zip
            ocs-dockerjobs-app-*.zip.sha256
          if-no-files-found: error

      # This container runs as root, and a root-owned workspace breaks the next
      # non-container checkout.
      - name: Return workspace ownership to the runner user
        if: always()
        run: |
          owner=$(stat -c '%u:%g' "$RUNNER_TEMP")
          chown -R "$owner" "$GITHUB_WORKSPACE" || true

  docker:
    needs: node
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/workflows/docker-build.yml@ci/npm-registry
    with:
      image-name: docker-jobs-app
      context: .
      dockerfile: Dockerfile
      build-args: |
        VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      mount-npm-registry: true
      release: ${{ startsWith(github.ref, 'refs/tags/') }}
      environment: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
      insecure-registry: true
    secrets: inherit
